[config]
skip_core_tasks = true

[tasks.setup]
workspace = false
description = "Install dependencies and generate certificates"
script = '''
#!/bin/bash
set -e

echo "Setting up Lightyear development environment..."

# Install WASM target
echo "Installing wasm32-unknown-unknown target..."
rustup target add wasm32-unknown-unknown

# Install Bevy CLI if not already installed
if ! command -v bevy &> /dev/null; then
    echo "Installing Bevy CLI..."
    cargo install bevy_cli
else
    echo "Bevy CLI already installed"
fi

# Generate certificates
echo "Generating certificates..."
cargo make generate-certs

echo "Setup complete!"
echo ""
echo "To run:"
echo "  Server:  cargo server"
echo "  Client:  cargo client"
echo "  Web:     cargo web"
'''

[tasks.generate-certs]
workspace = false
description = "Generate self-signed certificates for WebTransport/WebSocket"
script = '''
#!/bin/bash
set -e

CERT_DIR="certificates"
mkdir -p "$CERT_DIR"
cd "$CERT_DIR"

echo "Generating self-signed certificate..."

openssl req -x509 \
    -newkey ec \
    -pkeyopt ec_paramgen_curve:prime256v1 \
    -keyout key.pem \
    -out cert.pem \
    -days 14 \
    -nodes \
    -subj "/CN=localhost"

echo "Extracting certificate digest..."

FINGERPRINT=$(openssl x509 -in cert.pem -noout -sha256 -fingerprint | \
    sed 's/^.*=//' | sed 's/://g')

echo -n "$FINGERPRINT" > digest.txt

echo "Certificate generated successfully!"
echo "Digest: $FINGERPRINT"
'''

[tasks.web]
description = "Run WASM client with automatic certificate generation"
workspace = false
dependencies = ["ensure-certs"]
script = '''
#!/bin/bash
set -e

echo "Starting WASM client with Bevy CLI..."
cd crates/web

web_args=()
nostr_identity_profile=""

while [ "$#" -gt 0 ]; do
    case "$1" in
        --)
            shift
            ;;
        --nostr-identity)
            shift
            if [ "$#" -eq 0 ]; then
                echo "error: --nostr-identity requires a profile name" >&2
                exit 2
            fi
            nostr_identity_profile="$1"
            shift
            ;;
        --nostr-identity=*)
            nostr_identity_profile="${1#--nostr-identity=}"
            shift
            ;;
        *)
            web_args+=("$1")
            shift
            ;;
    esac
done

if [ -n "$nostr_identity_profile" ]; then
    echo "Using Nostr identity profile: $nostr_identity_profile"
    WEB_NOSTR_IDENTITY_PROFILE="$nostr_identity_profile" bevy run web "${web_args[@]}"
else
    bevy run web "${web_args[@]}"
fi
'''

[tasks.ensure-certs]
description = "Ensure certificates exist, generate if missing"
workspace = false
script = '''
#!/bin/bash
set -e

if [ ! -f "certificates/digest.txt" ]; then
    echo "Certificates not found, generating..."
    bash certificates/generate.sh
else
    echo "Certificates found"
fi
'''

[tasks.client-log]
description = "Run client with clean (no ANSI) log output to client.log"
workspace = false
script = '''
#!/bin/bash
set -e
NO_COLOR=1 cargo run -p client 2>&1 | tee client.log
'''

[tasks.server-log]
description = "Run server with clean (no ANSI) log output to server.log"
workspace = false
script = '''
#!/bin/bash
set -e
NO_COLOR=1 cargo run -p server 2>&1 | tee server.log
'''

[tasks.test-native]
description = "Run all native tests (excludes WASM)"
workspace = false
command = "cargo"
args = [
    "test",
    "--workspace",
    "--exclude",
    "web",
    # "-j4",
    # "--",
    # "--test-threads=4",
]

[tasks.test-all]
description = "Run all tests including WASM"
workspace = false
dependencies = ["ensure-certs"]
run_task = { name = ["test-native", "test-wasm"], parallel = false }

[tasks.test-wasm]
description = "Run WASM tests"
workspace = false
command = "wasm-pack"
args = ["test", "--headless", "--firefox", "crates/web"]