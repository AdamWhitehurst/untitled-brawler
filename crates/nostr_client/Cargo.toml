[package]
name = "nostr_client"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { workspace = true, features = ["bevy_log"] }
protocol = { workspace = true }
async-channel = "2"
futures-lite = "2"
nostr-sdk = { version = "0.44", features = ["nip49"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
sha2 = "0.10"
url = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

[dev-dependencies]
tempfile = "3"
