name: rpi-builder
version: "1.0"
description: Builder. Builds one slice in its own worktree and answers its pull requests until they merge.

defaults:
  runtime: claude-code

imports:
  - ref: "path:/home/aw/.local/share/mise/installs/node/24/lib/node_modules/@openrig/cli/daemon/specs/agents/shared"
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [verification-before-completion, rpi-shared:commit, rpi-shared:data-oriented-design, rpi-shared:development-team, rpi-shared:orchestration-team, rpi-shared:prose, rpi-shared:test-driven-development]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks, rpi-shared:claude-seat-settings, rpi-shared:codex-network]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
