name: rpi-orchestrator
version: "1.0"
description: Orchestration. Starts workflows, holds the human gates, and owns exceptions.

defaults:
  runtime: claude-code

imports:
  - ref: "path:/home/aw/.local/share/mise/installs/node/24/lib/node_modules/@openrig/cli/daemon/specs/agents/shared"
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [rpi-shared:orchestration-team]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks, rpi-shared:claude-seat-settings, rpi-shared:codex-network]

resources:
  guidance:
    - id: role
      path: guidance/role.md
    - id: ha-pair
      path: guidance/ha-pair.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: guidance/ha-pair.md
      delivery_hint: send_text
      required: true
  actions: []
