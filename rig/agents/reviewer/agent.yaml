name: rpi-reviewer
version: "1.0"
description: Code reviewer. Reviews a slice stack with rig proof add, independently of the other reviewer.

defaults:
  runtime: claude-code

imports:
  - ref: "path:/home/aw/.local/share/mise/installs/node/24/lib/node_modules/@openrig/cli/daemon/specs/agents/shared"
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks, rpi-shared:claude-seat-settings, rpi-shared:codex-network]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
