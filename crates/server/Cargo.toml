[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[features]
tracy = ["bevy/trace_tracy", "voxel_map_engine/tracy", "tracy-client/enable"]

[dependencies]
bevy = { workspace = true, default-features = true, features = [
  "file_watcher",
] }
voxel_map_engine = { workspace = true }
leafwing-input-manager = { workspace = true }
lightyear = { workspace = true, features = [
  "server",
  "netcode",
  "leafwing",
  "replication",
] }
server_lightyear = { workspace = true }
protocol = { workspace = true }
nostr_client = { workspace = true }
nostr_map_persistence = { workspace = true }
anyhow = "1.0"
persistence = { workspace = true }
avian3d = { workspace = true }
bincode = "1.3"
ron = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
tracy-client = { workspace = true }
zstd = "0.13"
getrandom = { workspace = true }

[dev-dependencies]
tempfile = "3"
ndshape = { path = "../../git/ndshape-rs" }
approx = { workspace = true }
mock_instant = { workspace = true }
test-log = { workspace = true }
protocol = { workspace = true, features = ["test_utils"] }
client = { path = "../client" }
ui = { path = "../ui" }
